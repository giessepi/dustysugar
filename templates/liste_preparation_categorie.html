<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Préparation - {{ categorie }}</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Préparation : {{ categorie }}</h1>
  <p><strong>Date de livraison :</strong> {{ date_livraison|date:"d F Y" }}</p>

  <table>
    <thead>
      <tr>
        <th>Produit</th>
        <th>Quantité totale</th>
      </tr>
    </thead>
    <tbody>
      {% for p in produits %}
      <tr>
        <td>{{ p.nom }}</td>
        <td>{{ p.quantite }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
